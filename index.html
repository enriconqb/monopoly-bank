<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monopoly Bank v1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --felt: #0f3d2e;
            --felt-deep: #0a2a20;
            --cream: #f4efe4;
            --paper: #fffdf8;
            --ink: #1a2e24;
            --muted: #5c6f66;
        }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background: var(--cream);
            background-image: radial-gradient(ellipse 120% 80% at 50% -20%, #d8e8d8 0%, transparent 55%);
            min-height: 100vh;
            padding-bottom: 96px;
            color: var(--ink);
            touch-action: manipulation;
        }
        body.has-fab { padding-bottom: 168px; }
        body.on-board { padding-bottom: 248px; }
        .app-header {
            position: sticky; top: 0; z-index: 30;
            background: rgba(244, 239, 228, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(15, 61, 46, 0.08);
        }
        .brand-mark {
            width: 40px; height: 40px; border-radius: 12px;
            background: var(--felt); color: #e8c547;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 12px rgba(15, 61, 46, 0.25);
        }
        .header-add {
            width: 44px; height: 44px; border-radius: 14px; border: none;
            background: var(--felt); color: #fff; font-size: 16px;
            display: flex; align-items: center; justify-content: center;
        }
        .header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .header-watch {
            border: none; background: transparent; cursor: pointer;
            font-family: inherit; padding: 0; text-align: right;
        }
        .add-player-fab {
            position: fixed; right: 16px; z-index: 45;
            bottom: calc(88px + env(safe-area-inset-bottom));
            width: 56px; height: 56px; border-radius: 18px; border: none;
            background: var(--felt); color: #fff; font-size: 20px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 24px rgba(15, 61, 46, 0.35);
        }
        .add-player-fab.hidden { display: none; }
        .summary-fab {
            left: 16px; right: auto;
            background: #c9a227; color: #1a1408;
        }
        .header-player-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
        .header-bk { font-size: 9px; font-weight: 800; background: #fee2e2; color: #dc2626; padding: 2px 7px; border-radius: 999px; }
        .name-badge {
            font-size: 12px; font-weight: 800; padding: 5px 10px;
            border-radius: 999px; max-width: min(46vw, 180px); overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
        }
        .header-balance {
            font-size: 16px; font-weight: 800; color: var(--felt);
            white-space: nowrap; line-height: 1.2;
        }
        .color-swatch-row { display: flex; flex-wrap: wrap; gap: 8px; }
        .color-swatch {
            width: 36px; height: 36px; border-radius: 12px; border: 3px solid transparent;
            cursor: pointer; padding: 0;
        }
        .color-swatch.selected { border-color: var(--ink); box-shadow: 0 0 0 2px #fff inset; }
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--paper);
            border-top: 1px solid rgba(15, 61, 46, 0.08);
            display: flex; justify-content: space-around; align-items: center;
            padding: 8px 8px calc(10px + env(safe-area-inset-bottom));
            z-index: 40; box-shadow: 0 -8px 28px rgba(15, 61, 46, 0.08);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            padding: 8px 6px; border-radius: 16px; min-width: 52px; min-height: 52px;
            cursor: pointer; border: none; background: transparent;
        }
        .nav-item .nav-icon { font-size: 18px; color: #8a9a93; }
        .nav-item .nav-label { font-size: 10px; font-weight: 700; color: #8a9a93; }
        .nav-item.active { background: var(--felt); }
        .nav-item.active .nav-icon, .nav-item.active .nav-label { color: #f4efe4; }
        .player-card, .prop-card, .tx-item, .hero-card, .settings-card, .empty-card {
            background: var(--paper);
            border-radius: 18px;
            box-shadow: 0 2px 10px rgba(15, 61, 46, 0.06);
        }
        .hero-card {
            padding: 18px 18px 16px;
            background: linear-gradient(145deg, var(--felt) 0%, var(--felt-deep) 100%);
            color: #f4efe4;
            display: flex; justify-content: space-between; align-items: flex-end;
        }
        .player-card {
            padding: 14px 14px 14px 14px; display: flex; align-items: center; gap: 12px;
            border: 2px solid transparent; width: 100%; text-align: left; cursor: pointer;
        }
        .player-card.bankrupt { opacity: .5; filter: grayscale(.4); }
        .player-avatar {
            width: 48px; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
            font-weight: 800; color: #fff; flex-shrink: 0; font-size: 18px;
        }
        .chip {
            font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 9999px;
            background: #eef3ef; color: var(--felt);
        }
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(10, 42, 32, .55); backdrop-filter: blur(8px);
            z-index: 60; display: flex; align-items: flex-end; justify-content: center; padding: 0;
        }
        .modal-content {
            background: var(--paper); border-radius: 24px 24px 0 0; width: 100%; max-width: 560px;
            max-height: 96vh; overflow-y: auto;
            padding: 4px 16px calc(14px + env(safe-area-inset-bottom));
            position: relative;
        }
        .modal-overlay.modal-full { align-items: stretch; }
        .modal-content.modal-content-full {
            max-height: 100%; height: 100%; border-radius: 0; max-width: 640px; margin: 0 auto;
            overflow: hidden; display: flex; flex-direction: column;
            padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
        }
        .trade-split { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
        .trade-half {
            flex: 1; min-height: 0; overflow-y: auto;
            border: 1.5px solid #e4ddd0; border-radius: 16px; padding: 10px; background: #fff;
        }
        .trade-sel {
            display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px;
        }
        .trade-sel-item {
            display: inline-flex; align-items: center; gap: 4px;
            background: #f3efe6; border-radius: 8px; padding: 4px 8px;
            font-size: 11px; font-weight: 700;
        }
        .trade-half.pick { background: #faf8f3; }
        .trade-sticky-bar {
            position: sticky; top: 0; z-index: 3;
            background: inherit; padding: 0 0 8px;
        }
        .trade-half.pick .trade-sticky-bar { background: #faf8f3; }
        .trade-half:not(.pick) .trade-sticky-bar { background: #fff; }
        .modal-content .section-label { margin: 8px 0 4px; }
        .modal-content .btn { min-height: 42px; padding: 10px 14px; font-size: 14px; }
        .modal-content .player-grid { gap: 6px; }
        .modal-content .player-option { padding: 6px 2px; }
        .modal-content .player-option .p-avatar { width: 30px; height: 30px; font-size: 12px; border-radius: 10px; }
        .modal-content .qa { min-height: 72px; padding: 10px 8px; font-size: 12px; }
        .modal-content .qa i { font-size: 18px; }
        .modal-handle {
            width: 40px; height: 4px; border-radius: 99px; background: #d6d0c4;
            margin: 4px auto 8px;
        }
        .modal-close {
            position: absolute; top: 10px; right: 10px; width: 40px; height: 40px;
            border: none; background: #dc2626; border-radius: 12px; color: #fff;
            box-shadow: 0 2px 8px rgba(220, 38, 38, 0.35);
            display: flex; align-items: center; justify-content: center;
        }
        .modal-close:hover, .modal-close:focus { background: #b91c1c; color: #fff; }
        @media (min-width: 640px) {
            .modal-overlay { align-items: center; padding: 12px; }
            .modal-content { border-radius: 24px; max-height: 94vh; }
        }
        .input-field, .select-field {
            width: 100%; padding: 14px 16px; border-radius: 14px; border: 2px solid #e4ddd0;
            font-size: 16px; background: #faf8f3; outline: none; font-family: inherit; color: var(--ink);
        }
        .input-field:focus, .select-field:focus { border-color: var(--felt); }
        .select-field { appearance: none; }
        .btn {
            border: none; padding: 14px 18px; border-radius: 14px;
            font-size: 15px; font-weight: 800; width: 100%; min-height: 52px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            font-family: inherit; cursor: pointer;
        }
        .btn-primary { background: var(--felt); color: #fff; }
        .btn-go { background: #d97706; color: #fff; }
        .btn-pay, .btn-rent { background: #dc2626; color: #fff; }
        .btn-recv { background: #16a34a; color: #fff; }
        .btn-xfer { background: #2563eb; color: #fff; }
        .btn-build { background: #0d9488; color: #fff; }
        .btn-hotel { background: #7c3aed; color: #fff; }
        .btn-mortgage { background: #ea580c; color: #fff; }
        .btn-danger { background: #b91c1c; color: #fff; }
        .btn-ghost, .btn-secondary {
            background: #efe9dc; color: #334155; font-weight: 700;
        }
        .player-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
        .player-option {
            background: #fff; border: 2px solid #e4ddd0; border-radius: 14px; padding: 10px 4px;
            display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
            cursor: pointer;
        }
        .player-option.selected { border-color: var(--felt); background: #e8f2eb; box-shadow: 0 0 0 2px rgba(15,61,46,.15); }
        .player-option .p-avatar {
            width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 14px; color: #fff;
        }
        .player-option .pname { font-size: 10px; font-weight: 700; color: #475569; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .quick-action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .qa {
            border: none; border-radius: 18px; padding: 16px 10px; min-height: 96px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
            font-weight: 800; font-size: 13px; color: #fff; font-family: inherit; cursor: pointer;
        }
        .qa i { font-size: 22px; }
        .qa-go { background: #d97706; }
        .qa-pay { background: #dc2626; }
        .qa-recv { background: #16a34a; }
        .qa-xfer { background: #2563eb; }
        .qa-trade { background: #7c3aed; }
        .trade-pick {
            border: 1.5px solid #e4ddd0; border-radius: 12px; padding: 8px 10px; margin-bottom: 6px;
            cursor: pointer; display: flex; gap: 8px; align-items: center; background: #fff;
        }
        .trade-pick.on { border-color: var(--felt); background: #e8f2eb; }
        .trade-pick .tp-code { font-size: 10px; font-weight: 800; }
        .trade-side { font-size: 12px; line-height: 1.4; }
        .trade-side b { display: block; margin-bottom: 4px; }
        .toast {
            position: fixed; bottom: 108px; left: 50%; transform: translateX(-50%);
            background: var(--felt); color: #fff; padding: 12px 20px; border-radius: 14px;
            font-size: 14px; font-weight: 700; z-index: 100; max-width: 85vw; text-align: center;
        }
        .toast.success { background: #16a34a; }
        .toast.error { background: #dc2626; }
        .prop-card {
            padding: 0; overflow: hidden; border: 1px solid #ebe4d6;
            min-height: 100%; text-align: left; cursor: pointer;
        }
        .prop-card.selected { box-shadow: 0 0 0 2px var(--felt); }
        .prop-strip { height: 8px; }
        .asset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .prop-name {
            font-weight: 800; font-size: 12px; line-height: 1.25;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .code-badge {
            display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: 0.04em;
            background: var(--felt); color: #f4efe4; border-radius: 6px; padding: 2px 6px;
        }
        .amt-wrap { position: relative; }
        .amt-wrap .input-field { padding-right: 68px; }
        .amt-max {
            position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
            border: none; background: var(--felt); color: #fff;
            font-size: 11px; font-weight: 800; letter-spacing: .04em;
            border-radius: 10px; padding: 8px 10px; min-height: 32px; cursor: pointer;
        }
        .stock-chip {
            flex: 1; background: var(--paper); padding: 10px 12px; border-radius: 14px;
            font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 8px;
            box-shadow: 0 2px 8px rgba(15,61,46,.05);
        }
        .asset-search-wrap {
            position: fixed; left: 0; right: 0; z-index: 35;
            bottom: calc(80px + env(safe-area-inset-bottom));
            padding: 10px 16px 14px;
            background: linear-gradient(to top, var(--cream) 78%, rgba(244,239,228,0));
            max-width: 48rem; margin: 0 auto;
        }
        .search-inner { position: relative; }
        .search-inner i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #8a9a93; }
        .search-inner .input-field { padding-left: 42px; }
        .search-chip-row {
            display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px;
            -webkit-overflow-scrolling: touch; scrollbar-width: none;
        }
        .search-chip-row::-webkit-scrollbar { display: none; }
        .search-suggest {
            flex-shrink: 0; border: none; border-radius: 999px;
            font-size: 11px; font-weight: 800; padding: 6px 11px;
            font-family: inherit; cursor: pointer; color: #fff;
        }
        .search-suggest.bank { background: #64748b; color: #fff; }
        .search-suggest.active { box-shadow: 0 0 0 2px var(--ink); }
        .view { display: none; }
        .view.active { display: block; }
        .badge { font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 9999px; }
        .section-label { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 0 8px; }
        .inbox-tabs {
            display: flex; gap: 8px; margin-bottom: 14px; padding: 4px;
            background: #efe8dc; border-radius: 14px;
        }
        .inbox-tab {
            flex: 1; border: none; border-radius: 11px; min-height: 40px;
            font-family: inherit; font-size: 11px; font-weight: 800; cursor: pointer;
            background: transparent; color: var(--muted); padding: 8px 6px;
        }
        .inbox-tab.active { background: var(--felt); color: #f4efe4; }
        .tx-go { border-left: 4px solid #d97706; }
        .tx-pay, .tx-rent { border-left: 4px solid #dc2626; }
        .tx-recv { border-left: 4px solid #16a34a; }
        .tx-p2p { border-left: 4px solid #2563eb; }
        .tx-buy, .tx-house, .tx-hotel { border-left: 4px solid #0d9488; }
        .tx-mortgage, .tx-unmortgage { border-left: 4px solid #ea580c; }
        .tx-deed, .tx-return { border-left: 4px solid #64748b; }
        .empty-card { padding: 36px 20px; text-align: center; border: 2px dashed #d6d0c4; }
        .settings-card { padding: 18px; }
        #moneyFxLayer {
            position: fixed; inset: 0; z-index: 120; display: none;
            pointer-events: none;
        }
        #moneyFxLayer.open {
            display: flex; align-items: stretch; justify-content: center;
            pointer-events: auto;
            touch-action: none;
        }
        .fx-screen {
            width: 100%; min-height: 100%;
            background: rgba(10, 42, 32, 0.92);
            display: flex; flex-direction: column; align-items: center;
            justify-content: space-between;
            padding: calc(28px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));
            position: relative; overflow: hidden;
        }
        .fx-party { z-index: 2; width: 100%; max-width: 340px; }
        .fx-card {
            background: var(--paper);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0,0,0,.28);
            width: 100%;
        }
        .fx-card .fx-strip { height: 7px; }
        .fx-from .fx-strip { background: #dc2626; }
        .fx-to .fx-strip { background: #16a34a; }
        .fx-card-body { padding: 14px 16px 16px; }
        .fx-role {
            display: inline-block;
            font-size: 10px; font-weight: 800; letter-spacing: .12em;
            padding: 3px 9px; border-radius: 999px; margin-bottom: 10px;
        }
        .fx-from .fx-role { background: #fee2e2; color: #b91c1c; }
        .fx-to .fx-role { background: #dcfce7; color: #15803d; }
        .fx-card-row { display: flex; align-items: center; gap: 12px; }
        .fx-avatar {
            width: 56px; height: 56px; border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 22px; color: #fff; flex-shrink: 0;
        }
        .fx-avatar.bank { background: var(--felt); color: #e8c547; }
        .fx-meta { min-width: 0; flex: 1; }
        .fx-name { color: var(--ink); font-weight: 800; font-size: 17px; }
        .fx-bal { font-size: 20px; font-weight: 800; margin-top: 2px; }
        .fx-bal.fx-down { color: #dc2626; }
        .fx-bal.fx-up { color: #16a34a; }
        .fx-mid {
            z-index: 2; text-align: center; position: relative;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
        }
        .fx-amount { font-size: 42px; font-weight: 800; color: #e8c547; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
        .fx-amount.down { color: #f87171; }
        .fx-amount.up { color: #4ade80; }
        .fx-amount.buy { color: #86efac; }
        .fx-ctx {
            color: #f4efe4; font-size: 18px; font-weight: 800; line-height: 1.25;
            max-width: 320px;
        }
        .fx-ctx-sub { color: rgba(244,239,228,.75); font-size: 13px; font-weight: 700; max-width: 320px; }
        .fx-prop-card {
            background: var(--paper); border-radius: 16px; overflow: hidden;
            width: 100%; max-width: 280px; text-align: left;
            box-shadow: 0 8px 28px rgba(0,0,0,.28);
        }
        .fx-prop-card .fx-prop-name { font-weight: 800; font-size: 15px; color: var(--ink); margin-top: 6px; }
        .fx-hint { color: rgba(244,239,228,.85); font-size: 13px; font-weight: 700; min-height: 20px; opacity: 0; }
        .role-overlay {
            position: fixed; inset: 0; z-index: 90;
            background: rgba(10, 42, 32, .72); backdrop-filter: blur(10px);
            display: flex; align-items: flex-end; justify-content: center;
        }
        .role-overlay.role-pick {
            align-items: center;
            padding: 16px;
        }
        .role-overlay.role-pick .role-card {
            border-radius: 24px;
            padding: 22px 18px;
        }
        .btn-player-role { background: var(--felt); color: #fff; }
        .role-card {
            background: var(--paper); width: 100%; max-width: 560px;
            border-radius: 24px 24px 0 0; padding: 20px 18px calc(20px + env(safe-area-inset-bottom));
        }
        @media (min-width: 640px) {
            .role-overlay { align-items: center; padding: 16px; }
            .role-card { border-radius: 24px; }
        }
        .player-chip {
            font-size: 10px; font-weight: 800; letter-spacing: .08em;
            background: #e8c547; color: var(--felt); padding: 3px 8px; border-radius: 999px;
        }
        .req-head {
            display: flex; align-items: center; gap: 12px; color: #fff;
            padding: 16px 16px 18px; margin: -20px -18px 16px; border-radius: 24px 24px 0 0;
        }
        @media (min-width: 640px) {
            .req-head { border-radius: 24px 24px 0 0; }
        }
        .req-icon {
            width: 48px; height: 48px; border-radius: 14px; flex-shrink: 0;
            background: rgba(255,255,255,.22); display: flex; align-items: center; justify-content: center;
            font-size: 22px;
        }
        .req-amt { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; margin: 4px 0 12px; }
        .go-summary-card { position: relative; padding-top: 18px; }
        .go-summary-card .modal-close { width: 32px; height: 32px; top: 10px; right: 10px; border-radius: 10px; }
        .go-rank { width: 100%; text-align: left; border: 2px solid transparent; cursor: pointer; }
        .go-rank.winner { border-color: #c9a227; background: linear-gradient(180deg, #fff8e1, var(--paper)); }
        .go-winner-label { font-size: 28px; font-weight: 800; color: #c9a227; letter-spacing: .04em; line-height: 1.1; }
        .go-rank-detail { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(15,61,46,.1); }
        .go-asset-row { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; font-weight: 700; padding: 4px 0; }
        .req-row {
            display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
            padding: 8px 0; border-bottom: 1px solid #ebe4d6; font-size: 13px;
        }
        .req-row span { color: var(--muted); font-weight: 700; flex-shrink: 0; }
        .req-row b { text-align: right; font-weight: 800; }
        .req-av {
            display: inline-flex; width: 22px; height: 22px; border-radius: 7px; align-items: center; justify-content: center;
            color: #fff; font-size: 11px; font-weight: 800; vertical-align: middle; margin-right: 4px;
        }
        .req-player-tag {

function isServerMode() {
    return location.protocol === 'http:' || location.protocol === 'https:';
}
function isPlayer() { return !!(appSession && appSession.role === 'player'); }
function isBanker() { return !isPlayer(); }
function sessionPlayer() { return isPlayer() ? getPlayer(appSession.playerId) : null; }

function readSession() {
    try {
        const raw = localStorage.getItem(SESSION_KEY);
        if (!raw) return null;
        const s = JSON.parse(raw);
        if (s && (s.role === 'banker' || s.role === 'player')) return s;
    } catch (e) {}
    return null;
}
function writeSession(s) {
    appSession = s;
    try {
        if (s) localStorage.setItem(SESSION_KEY, JSON.stringify(s));
        else localStorage.removeItem(SESSION_KEY);
    } catch (e) {}
}
function applyLoaded(data) {
    if (!data || typeof data !== 'object') return;
    if (remoteSnapshotStale(data)) {
        if (Array.isArray(data.requests)) mergeRequests(data.requests);
        return;
    }
    if (Array.isArray(data.players)) state.players = data.players;
    if (Array.isArray(data.properties) && data.properties.length === catalog().length) {
        const fresh = catalog();
        const byId = {};
        data.properties.forEach(function (p) { byId[p.id] = p; });
        state.properties = fresh.map(function (base) {
            const old = byId[base.id];
            if (!old) return base;
            return Object.assign({}, base, {
                ownerId: old.ownerId || null,
                houses: old.houses || 0,
                hotel: !!old.hotel,
                mortgaged: !!old.mortgaged
            });
        });
    }
    if (Array.isArray(data.transactions)) state.transactions = data.transactions;
    if (typeof data.colorIndex === 'number') state.colorIndex = data.colorIndex;
    if (data.settings) Object.assign(state.settings, data.settings);
    mergeRequests(Array.isArray(data.requests) ? data.requests : []);
    state.lastFx = data.lastFx || null;
    state.debtSettlement = data.debtSettlement || null;
    state.gameOver = data.gameOver || null;
    if (typeof data.epoch === 'number') state.epoch = data.epoch;
    if (typeof data.rev === 'number') state.rev = data.rev;
}
function remoteSnapshotStale(data) {
    if (!data || typeof data !== 'object') return true;
    const inEpoch = typeof data.epoch === 'number' ? data.epoch : 0;
    const inRev = typeof data.rev === 'number' ? data.rev : 0;
    const localEpoch = Number(state.epoch) || 0;
    const localRev = Number(state.rev) || 0;
    if (inEpoch < localEpoch) return true;
    if (inEpoch === localEpoch && inRev < localRev) return true;
    return false;
}
function canFullSave() {
    if (!isServerMode()) return true;
    return !!(appSession && appSession.role === 'banker');
}
function bumpRev() {
    state.rev = (Number(state.rev) || 0) + 1;
}
function kickStalePlayerSession() {
    if (!isServerMode()) return false;
    if (!appSession || appSession.role !== 'player') return false;
    if (getPlayer(appSession.playerId)) return false;
    hideGameOverOverlay(true);
    hideRequestOverlay();
    hideTradeOverlay();
    hideDebtOverlay();
    closeModal();
    writeSession(null);
    showRoleModal();
    updateSummaryFab();
    return true;
}
function requestProgress(r) {
    if (!r) return 0;
    if (r.status === 'approved' || r.status === 'rejected') return 3;
    if (r.status === 'pending') return 2;
    if (r.status === 'negotiating') return 1;
    return 0;
}
function mergeRequests(remoteList) {
    remoteList = Array.isArray(remoteList) ? remoteList : [];
    const localById = {};
    (state.requests || []).forEach(function (r) { if (r && r.id) localById[r.id] = r; });
    const remoteIds = {};
    const out = [];
    remoteList.forEach(function (r) {
        if (!r || !r.id) return;
        remoteIds[r.id] = true;
        const loc = localById[r.id];
        if (!loc) { out.push(r); return; }
        const lp = requestProgress(loc);
        const rp = requestProgress(r);
        if (lp >= 3 && rp < 3) { out.push(loc); return; }
        if (loc.status === 'negotiating' && r.status === 'negotiating') {
            const lr = (loc.payload && loc.payload.round) || 0;
            const rr = (r.payload && r.payload.round) || 0;
            out.push(rr >= lr ? r : loc);
            return;
        }
        out.push(lp > rp ? loc : r);
    });
    const now = Date.now();
    (state.requests || []).forEach(function (r) {
        if (!r || !r.id || remoteIds[r.id]) return;
        const age = now - (r.createdAt || 0);
        const resolvedAge = now - (r.resolvedAt || 0);
        if (age < 15000 && (r.status === 'pending' || r.status === 'negotiating')) out.push(r);
        else if (requestProgress(r) >= 3 && resolvedAge < 15000) out.push(r);
    });
    state.requests = out;
}
function snapshotStateJson() {
    return JSON.stringify(state);
}
function saveState() {
    if (!Array.isArray(state.requests)) state.requests = [];
    if (isServerMode()) return;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}
async function flushSave() {
    saveState();
}
function ingestServerState(data) {
    if (!data || !data.state) return data;
    suppressSave = true;
    applyLoaded(data.state);
    lastRemoteJson = JSON.stringify(data.state);
    suppressSave = false;
    renderAll({ skipSave: true, skipBankerPopup: true });
    playLastFxIfNew();
    maybeShowDebtOverlay();
    maybeShowGameOver();
    return data;
}
async function postOp(body) {
    if (!isServerMode()) return { ok: false, error: 'offline' };
    try {
        const res = await fetch(SAVE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data && data.state) ingestServerState(data);
        else if (data && Array.isArray(data.requests)) mergeRequests(data.requests);
        return data || { ok: false };
    } catch (e) {
        return { ok: false, error: 'network' };
    }
}
async function postCommand(kind, extra) {
    return postOp(Object.assign({ _op: 'command', kind: kind }, extra || {}));
}
async function upsertRequestOnServer(req) {
    if (!req) return false;
    if (!isServerMode()) {
        saveState();
        return true;
    }
    try {
        const res = await fetch(SAVE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ _op: 'upsertRequest', request: req, epoch: Number(state.epoch) || 0 })
        });
        if (!res.ok) return false;
        const data = await res.json();
        if (data && data.state) {
            suppressSave = true;
            applyLoaded(data.state);
            lastRemoteJson = JSON.stringify(data.state);
            suppressSave = false;
            mergeRequests(data.state.requests || data.requests || []);
        } else if (data && Array.isArray(data.requests)) mergeRequests(data.requests);
        if (data && data.duplicate) return 'duplicate';
        return !!(data && data.ok);
    } catch (e) {
        return false;
    }
}
async function mergeRemoteRequestsOnly() {
    if (!isServerMode()) return;
    try {
        const r = await fetch(SAVE_URL, { cache: 'no-store' });
        if (!r.ok) return;
        const data = await r.json();
        if (data && Array.isArray(data.requests)) mergeRequests(data.requests);
    } catch (e) {}
}
function loadStateFromLocal() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        applyLoaded(JSON.parse(raw));
    } catch (e) {}
}
async function loadStateFromServer() {
    const r = await fetch(SAVE_URL, { cache: 'no-store' });
    if (!r.ok) return false;
    const data = await r.json();
    if (data) {
        applyLoaded(data);
        lastRemoteJson = JSON.stringify(data);
    }
    return true;
}

function generateId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function formatMoney(n) { return '$' + Math.abs(Number(n) || 0).toLocaleString('id-ID'); }
function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }
function getPlayer(id) { return state.players.find(p => p.id === id); }
function getProp(id) { return state.properties.find(p => p.id === id); }
function activePlayers() { return state.players.filter(p => !p.bankrupt); }
function nextColor() { const c = PLAYER_COLORS[state.colorIndex % PLAYER_COLORS.length]; state.colorIndex++; return c; }

function pushTx(partial) {
    state.transactions.push(Object.assign({ id: generateId(), timestamp: Date.now() }, partial));
    if (state.transactions.length > 200) state.transactions = state.transactions.slice(-200);
}

function showToast(message, type) {
    const el = document.createElement('div');
    el.className = 'toast ' + (type || '');
    el.textContent = message;
    document.getElementById('toastContainer').appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 2200);
}

function groupProps(group) { return state.properties.filter(p => p.group === group); }

function groupLetter(group) {
    const i = GROUP_ORDER.indexOf(group);
    return i < 0 ? '?' : String.fromCharCode(65 + i);
}

function propCode(p) {
    const n = groupProps(p.group).findIndex(x => x.id === p.id) + 1;
    return groupLetter(p.group) + n;
}

function propMatchesQuery(p, q) {
    q = String(q || '').toLowerCase().trim();
    if (!q) return true;
    const code = propCode(p).toLowerCase();
    const letter = groupLetter(p.group).toLowerCase();
    if (q.length === 1) {
        return letter === q || code.charAt(0) === q;
    }
    if (q.length === 2) {
        return code === q || code.indexOf(q) === 0;
    }
    const owner = p.ownerId ? getPlayer(p.ownerId) : null;
    const blob = [code, p.name, owner ? owner.name : 'bank', GROUP_META[p.group].label].join(' ').toLowerCase();
    return blob.indexOf(q) !== -1;
}

function ownsFullSet(playerId, group) {
    const list = groupProps(group);
    if (!list.length) return false;
    return list.every(p => p.ownerId === playerId && !p.mortgaged);
}

function houseStock() {
    let houses = 0, hotels = 0;
    state.properties.forEach(p => {
        if (p.hotel) hotels += 1;
        else houses += p.houses;
    });
    return { houses, hotels };
}

function calcStreetRent(prop) {
    if (!prop.ownerId || prop.mortgaged) return 0;
    if (prop.hotel) return prop.rentLevels[5];
    if (prop.houses > 0) return prop.rentLevels[prop.houses];
    const base = prop.rentLevels[0];
    return ownsFullSet(prop.ownerId, prop.group) ? base * 2 : base;
}

function railroadCount(ownerId) {
    return state.properties.filter(p => p.group === 'railroad' && p.ownerId === ownerId && !p.mortgaged).length;
}

function calcRailroadRent(prop) {
    if (!prop.ownerId || prop.mortgaged) return 0;
    const n = railroadCount(prop.ownerId);
    return prop.rentLevels[Math.max(0, n - 1)] || 0;

function playerLiquidity(playerId) {

    if (!pl) return 0;
    let n = Number(pl.balance) || 0;
    state.properties.forEach(function (pr) {
        if (pr.ownerId !== playerId) return;
        const refund = Math.floor((pr.houseCost || 0) / 2);
        if (pr.hotel) n += refund * 5;

}

    if (state.debtSettlement) { showToast('Selesaikan hipotek wajib dulu', 'error'); return false; }
    if (payer.balance >= amount) {
        settleRentPayment(payer.id, owner.id, amount, propertyId);
        return true;
    }
    if (playerLiquidity(payer.id) >= amount) {
        beginDebtMortgage({
            kind: 'rent',
            payerId: payer.id,
            ownerId: owner.id,
            amount: amount,
            propertyId: propertyId

function applyPayBankDue(payer, amount, reason) {

    if (payer.bankrupt) { showToast('Pemain bangkrut', 'error'); return false; }
    if (state.debtSettlement) { showToast('Selesaikan hipotek wajib dulu', 'error'); return false; }
    const note = reason || 'Bayar bank';
    if (payer.balance >= amount) {
        settlePayBankPayment(payer.id, amount, note);
        return true;
    }
    if (playerLiquidity(payer.id) >= amount) {
        beginDebtMortgage({
            kind: 'pay_bank',
            payerId: payer.id,
            ownerId: 'bank',

            propertyId: null,

function settleRentPayment(payerId, ownerId, amount, propertyId) {
    const payer = getPlayer(payerId);
    const owner = getPlayer(ownerId);
    if (!payer || !owner) return;
    const old = snapshotBalances();
    payer.balance -= amount;
    owner.balance += amount;
    state.debtSettlement = null;
    hideDebtOverlay();
    const p = getProp(propertyId);
    pushTx({ type: 'rent', from: payerId, to: ownerId, propertyId: propertyId, amount: amount, reason: 'Sewa ' + (p ? p.name : '') });
    finishMoney(payerId, ownerId, old, 'Sewa ' + formatMoney(amount), amount);

function settleRentBankruptcy(payerId, ownerId, amount, propertyId) {
    const payer = getPlayer(payerId);
    const owner = getPlayer(ownerId);
    if (!payer || !owner) return;
    const old = snapshotBalances();
    const paid = Math.min(Number(payer.balance) || 0, amount);
    payer.balance -= paid;
    owner.balance += paid;
    payer.bankrupt = true;
    payer.balance = 0;
    releasePlayerAssetsToBank(payerId);
    state.debtSettlement = null;
    hideDebtOverlay();
    const p = getProp(propertyId);
    if (paid > 0) {
        pushTx({ type: 'rent', from: payerId, to: ownerId, propertyId: propertyId, amount: paid, reason: 'Sewa sisa (bangkrut) ' + (p ? p.name : '') });
    }
    pushTx({ type: 'bangkrut', from: payerId, to: 'bank', amount: 0, propertyId: propertyId, reason: 'Bangkrut sewa' });
    finishMoney(payerId, ownerId, old, payer.name + ' bangkrut', paid);
}
function settlePayBankBankruptcy(payerId, amount, reason) {
    const payer = getPlayer(payerId);
    if (!payer) return;
    const old = snapshotBalances();
    const paid = Math.min(Number(payer.balance) || 0, amount);
    payer.balance -= paid;
    payer.bankrupt = true;
    payer.balance = 0;
    releasePlayerAssetsToBank(payerId);
    state.debtSettlement = null;
    hideDebtOverlay();
    if (paid > 0) {
        pushTx({ type: 'pay-bank', from: payerId, to: 'bank', amount: paid, reason: (reason || 'Bayar bank') + ' (bangkrut)' });
    }
    pushTx({ type: 'bangkrut', from: payerId, to: 'bank', amount: 0, reason: 'Bangkrut bayar bank' });

function flyBillsInModal() {
    const start = fxPoint('#fxFrom .fx-avatar, #fxFrom');
    const end = fxPoint('#fxTo .fx-avatar, #fxTo');

    for (let i = 0; i < n; i++) {
        const bill = document.createElement('i');
        bill.className = 'fa-solid fa-money-bill-wave fx-bill';
        document.getElementById('moneyFxLayer').appendChild(bill);
        gsap.fromTo(bill, {
            x: start.x - 14 + (Math.random() * 24 - 12),
            y: start.y - 10,
            opacity: 0,
            scale: 0.55,
            rotation: Math.random() * 40 - 20
        }, {
            x: end.x - 14 + (Math.random() * 28 - 14),
            y: end.y - 10,
            opacity: 1,
            scale: 1.05,
            rotation: Math.random() * 50 - 20,
            duration: 0.85,
            delay: i * 0.06,
            ease: 'power2.inOut',
            onComplete: function () {
                gsap.to(bill, { opacity: 0, scale: 0.4, duration: 0.2, onComplete: function () { bill.remove(); } });
            }

function tweenBalanceEl(el, fromVal, toVal, skipMotion) {
    if (!el || fromVal === toVal) return;
    el.textContent = signedMoney(fromVal);
    if (skipMotion) {
        el.textContent = signedMoney(toVal);
        return;
    }
    const obj = { n: fromVal };
    gsap.to(obj, {
        n: toVal,
        duration: 0.9,
        ease: 'power1.out',
        onUpdate: function () { el.textContent = signedMoney(Math.round(obj.n)); },
        onComplete: function () { el.textContent = signedMoney(toVal); }
    });
}

        if (type === 'bangkrut' && iPay) return { title: 'Kamu bangkrut', sub: 'Aset kembali ke bank' };
        if (iPay) return { title: 'Kamu membayar', sub: reason || propName };
        if (iGet) return { title: 'Kamu menerima', sub: reason || propName };
    }
    if (type === 'rent') return { title: fromN + ' membayar sewa ke ' + toN, sub: propName };
    if (type === 'buy') return { title: fromN + ' membeli properti', sub: propName };
    if (type === 'go') return { title: toN + ' menerima gaji GO', sub: '' };
    if (type === 'pay-bank') return { title: fromN + ' membayar ke bank', sub: reason };
    if (type === 'recv-bank') return { title: toN + ' menerima dari bank', sub: reason };
    if (type === 'p2p') return { title: fromN + ' transfer ke ' + toN, sub: reason };
    if (type === 'house') return { title: fromN + ' membangun rumah', sub: propName };
    if (type === 'hotel') return { title: fromN + ' membangun hotel', sub: propName };

function fxAmountMood(fx) {
    const me = isPlayer() ? (appSession && appSession.playerId) : null;
    if (!me) return 'neutral';
    if (fx.type === 'buy' && fx.from === me) return 'buy';
    if (fx.from === me && fx.to !== me) return 'down';
    if (fx.to === me && fx.from !== me) return 'up';
    return 'neutral';
}

function playMoneyAnimation(opts) {
    const from = opts.from;
    const to = opts.to;
    const amount = opts.amount || 0;
    const oldBalances = opts.oldBalances || {};
    const type = opts.type || '';
    const ctx = fxHeadline(opts);
    const mood = fxAmountMood(opts);
    const moodClass = mood === 'down' ? ' down' : (mood === 'up' ? ' up' : (mood === 'buy' ? ' buy' : ''));
    const arrow = mood === 'down' ? '<i class="fa-solid fa-arrow-down"></i>' : (mood === 'up' || mood === 'buy' ? '<i class="fa-solid fa-arrow-up"></i>' : '');
    const propCard = opts.propertyId ? fxPropCardHtml(opts.propertyId) : '';
    moneyFxCanClose = false;
    gotoPlayersThen(function () {
        const layer = document.getElementById('moneyFxLayer');
        const skipMotion = reduceMotion() || typeof gsap === 'undefined';
        layer.classList.remove('ready');
        layer.classList.add('open');
        layer.innerHTML = '<div class="fx-screen">' +
            fxPartyHtml(from, oldBalances, 'from') +
            '<div class="fx-mid">' +
            '<p class="fx-ctx">' + escapeHtml(ctx.title) + '</p>' +
            (ctx.sub ? '<p class="fx-ctx-sub">' + escapeHtml(ctx.sub) + '</p>' : '') +
            propCard +
            '<div class="fx-amount' + moodClass + '">' + arrow + formatMoney(amount) + '</div>' +
            '<div class="fx-hint" id="fxHint"></div></div>' +
            fxPartyHtml(to, oldBalances, 'to') +
            '</div>';
        function swallowFxTap(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }
            closeMoneyFx();
        }
        layer.onpointerdown = swallowFxTap;
        layer.onclick = swallowFxTap;

        const fromP = from === 'bank' ? null : getPlayer(from);
        const toP = to === 'bank' ? null : getPlayer(to);
        const fromEl = layer.querySelector('.fx-bal-from');
        const toEl = layer.querySelector('.fx-bal-to');
        if (fromP && fromEl) tweenBalanceEl(fromEl, oldBalances[fromP.id], fromP.balance, skipMotion);
        if (toP && toEl) tweenBalanceEl(toEl, oldBalances[toP.id], toP.balance, skipMotion);

        if (!skipMotion) flyBillsInModal();
        playMoneyRoleSounds(from, to, type);
        const wait = skipMotion ? 80 : 1100;
        setTimeout(enableMoneyFxClose, wait);
    });
}

        '<i class="fa-solid fa-magnifying-glass"></i>' +

async function resetGame() {

    if (!confirm('Hapus semua pemain, aset, dan riwayat?')) return;

    hideGameOverOverlay(true);
    hideRequestOverlay();
    hideTradeOverlay();
    hideDebtOverlay();

        await postCommand('reset', {});
    } else {
        state.players = [];
        state.properties = catalog();
        state.transactions = [];
        state.requests = [];
        state.lastFx = null;
        state.debtSettlement = null;

function rankAssetValue(pr) {
    if (!pr) return 0;
    return pr.mortgaged ? (Number(pr.mortgage) || 0) : (Number(pr.price) || 0);
}
function buildGameOverSnapshot() {
    const rankings = state.players.slice().map(function (pl) {
        const assets = state.properties.filter(function (pr) { return pr.ownerId === pl.id; }).map(function (pr) {
            return {
                id: pr.id,
                code: propCode(pr),
                name: pr.name,
                value: rankAssetValue(pr),
                mortgaged: !!pr.mortgaged,
                houses: pr.houses || 0,
                hotel: !!pr.hotel
            };
        });
        const assetValue = assets.reduce(function (s, a) { return s + a.value; }, 0);
        const balance = Number(pl.balance) || 0;
        return {
            playerId: pl.id,
            name: pl.name,
            color: pl.color,
            bankrupt: !!pl.bankrupt,
            balance: balance,
            assetValue: assetValue,
            netWorth: balance + assetValue,
            assets: assets
        };
    }).sort(function (a, b) {
        if (b.netWorth !== a.netWorth) return b.netWorth - a.netWorth;
        return String(a.name || '').localeCompare(String(b.name || ''), 'id');
    });
    return { endedAt: Date.now(), rankings: rankings };
}
function confirmEndGame() {
    if (isPlayer()) return;
    if (gameIsOver()) {
        showGameOverOverlay(true);
        return;
    }
    if (!confirm('Akhiri permainan dan hitung peringkat? Permintaan baru akan ditutup.')) return;
    gameOverDismissedEndedAt = 0;
    gameOverExpandIdx = 0;
    hideRequestOverlay();
    hideTradeOverlay();
    if (isServerMode()) {
        postCommand('endGame', {}).then(function () { showGameOverOverlay(true); });
        return;
    }
    state.gameOver = buildGameOverSnapshot();
    saveState();
    renderAll({ skipSave: true });
    showGameOverOverlay(true);
}
function updateSummaryFab() {
    const fab = document.getElementById('summaryFab');
    if (!fab) return;
    fab.classList.toggle('hidden', !gameIsOver());
}
function gameOverOverlayHtml() {
    const go = state.gameOver;
    if (!go || !go.rankings) return '';
    const rows = go.rankings.map(function (r, i) {
        const open = gameOverExpandIdx === i;
        const ink = textOnColor(r.color);
        const assetsHtml = (r.assets || []).length
            ? r.assets.map(function (a) {
                const extra = a.hotel ? ' hotel' : (a.houses ? (' ' + a.houses + ' rumah') : '');
                return '<div class="go-asset-row"><span>' + escapeHtml(a.code) + ' ' + escapeHtml(a.name) +
                    (a.mortgaged ? ' · hipotek' : '') + extra + '</span><span>' + formatMoney(a.value) + '</span></div>';
            }).join('')
            : '<p class="text-xs" style="color:var(--muted)">Tidak ada aset</p>';
        const detail = open
            ? '<div class="go-rank-detail">' +
                (r.bankrupt ? '<span class="badge" style="background:#fee2e2;color:#dc2626">Bangkrut</span>' : '') +
                '<p class="text-sm font-bold mt-2">Saldo ' + formatMoney(r.balance) + '</p>' +
                '<p class="text-sm font-bold">Nilai aset ' + formatMoney(r.assetValue) + '</p>' +
                '<p class="text-sm font-extrabold">Net worth ' + formatMoney(r.netWorth) + '</p>' +
                '<p class="text-xs font-bold mt-2" style="color:var(--muted)">Aset</p>' + assetsHtml + '</div>'
            : '';
        return '<button type="button" class="player-card go-rank' + (i === 0 ? ' winner' : '') + '" onclick="toggleGoRank(' + i + ')">' +
            '<div class="player-avatar" style="background:' + r.color + ';color:' + ink + '">' + (i + 1) + '</div>' +
            '<div class="flex-1 min-w-0">' +
            (i === 0 ? '<p class="go-winner-label">Winner</p>' : '<p class="text-xs font-bold" style="color:var(--muted)">Peringkat ' + (i + 1) + '</p>') +
            '<p class="font-extrabold truncate">' + escapeHtml(r.name) +
            (r.bankrupt ? ' <span class="badge" style="background:#fee2e2;color:#dc2626">Bangkrut</span>' : '') + '</p>' +
            '<p class="text-sm font-bold">' + formatMoney(r.netWorth) + '</p>' + detail + '</div></button>';
    }).join('');
    return '<div class="role-card go-summary-card" style="max-height:86vh;overflow:auto">' +
        '<button type="button" onclick="hideGameOverOverlay()" class="modal-close" aria-label="Tutup"><i class="fa-solid fa-xmark"></i></button>' +
        '<p class="text-xl font-extrabold mb-3 pr-12">Hasil permainan</p>' +
        '<div class="space-y-2">' + rows + '</div></div>';
}
function toggleGoRank(i) {
    gameOverExpandIdx = gameOverExpandIdx === i ? -1 : i;
    const box = document.getElementById('gameOverOverlay');
    if (box && !box.classList.contains('hidden')) box.innerHTML = gameOverOverlayHtml();
}
function showGameOverOverlay(force) {
    const box = document.getElementById('gameOverOverlay');
    if (!box) return;
    if (!gameIsOver()) {
        hideGameOverOverlay(true);
        return;
    }
    if (!force && gameOverDismissedEndedAt === state.gameOver.endedAt) {
        updateSummaryFab();
        return;
    }
    gameOverDismissedEndedAt = 0;
    box.classList.remove('hidden');
    box.innerHTML = gameOverOverlayHtml();
    updateSummaryFab();
}
function hideGameOverOverlay(clearDismiss) {
    const box = document.getElementById('gameOverOverlay');
    if (box) {
        box.classList.add('hidden');
        box.innerHTML = '';
    }
    if (!clearDismiss && gameIsOver()) gameOverDismissedEndedAt = state.gameOver.endedAt;
    else if (clearDismiss) gameOverDismissedEndedAt = 0;
    updateSummaryFab();
}
function maybeShowGameOver() {
    if (!gameIsOver()) {
        hideGameOverOverlay(true);
        return;
    }
    showGameOverOverlay(false);
}

function sellHouse(propId) {
    const p = getProp(propId);

    const refund = Math.floor(p.houseCost / 2);
    if (isServerMode()) { closeModal(); postCommand('build', { propertyId: propId, kind: 'sell' }); return; }
    const old = snapshotBalances();
    if (p.hotel) {

        p.hotel = false;
        p.houses = 4;
        owner.balance += refund;
        pushTx({ type: 'sell-build', from: 'bank', to: owner.id, propertyId: p.id, amount: refund, reason: 'Turun hotel ' + p.name });
    } else if (p.houses > 0) {
        if (!evenBuildOk(p, p.houses - 1, false)) { showToast('Even-sell', 'error'); return; }
        p.houses -= 1;
        owner.balance += refund;
        pushTx({ type: 'sell-build', from: 'bank', to: owner.id, propertyId: p.id, amount: refund, reason: 'Jual rumah ' + p.name });
    } else { showToast('Tidak ada bangunan', 'error'); return; }

function copyShareUrl() {
    const url = location.origin + location.pathname;
    function ok() { showToast('Tautan disalin', 'success'); }
    function fallbackCopy() {
        const ta = document.createElement('textarea');
        ta.value = url;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); ok(); } catch (e) { showToast('Salin manual: ' + url, 'error'); }
        ta.remove();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(ok).catch(fallbackCopy);
    } else fallbackCopy();
}

function requestTheme(type, kind) {
    if (type === 'build' && kind === 'hotel') {
        return { title: 'Bangun hotel', icon: 'fa-hotel', color: '#7c3aed', flow: 'Pemain → bank' };
    }
    if (type === 'build' && kind === 'sell') {
        return { title: 'Jual bangunan', icon: 'fa-arrow-down', color: '#16a34a', flow: 'Bank → pemain' };
    }
    const map = {
        go: { title: 'Gaji GO', icon: 'fa-flag-checkered', color: '#d97706', flow: 'Bank → pemain' },
        pay_bank: { title: 'Bayar ke bank', icon: 'fa-building-columns', color: '#dc2626', flow: 'Pemain → bank' },
        recv_bank: { title: 'Terima dari bank', icon: 'fa-hand-holding-dollar', color: '#16a34a', flow: 'Bank → pemain' },
        transfer: { title: 'Transfer pemain', icon: 'fa-arrow-right-arrow-left', color: '#2563eb', flow: 'Pemain → pemain' },
        rent: { title: 'Tagih sewa', icon: 'fa-hand-holding-dollar', color: '#dc2626', flow: 'Penyewa → pemilik' },
        buy: { title: 'Beli aset', icon: 'fa-cart-shopping', color: '#16a34a', flow: 'Pemain → bank' },
        build: { title: 'Bangun rumah', icon: 'fa-house', color: '#0d9488', flow: 'Pemain → bank' },
        mortgage: { title: 'Hipotek', icon: 'fa-file-invoice-dollar', color: '#ea580c', flow: 'Bank → pemain' },
        unmortgage: { title: 'Tebus hipotek', icon: 'fa-unlock', color: '#ea580c', flow: 'Pemain → bank' },
        trade: { title: 'Tukar aset', icon: 'fa-handshake', color: '#7c3aed', flow: 'Pemain ⇄ pemain' }
    };
    return map[type] || { title: type || 'Permintaan', icon: 'fa-bell', color: '#64748b', flow: '' };
}
function reqLabel(req) {
    return requestTheme(req.type, (req.payload || {}).kind).title;
}
function miniAvatarHtml(p) {
    if (!p) return '?';
    return '<span class="req-player-tag" style="background:' + p.color + ';color:#fff">' +
        '<span class="req-av" style="background:rgba(255,255,255,.25);color:#fff">' + escapeHtml(p.name.charAt(0).toUpperCase()) + '</span>' +
        escapeHtml(p.name) + '</span>';
}
function reqRow(label, valueHtml) {
    return '<div class="req-row"><span>' + escapeHtml(label) + '</span><b>' + valueHtml + '</b></div>';
}
function requestAmount(req) {
    const pl = req.payload || {};
    const prop = pl.propertyId ? getProp(pl.propertyId) : null;
    if (req.type === 'go') return state.settings.goAmount;
    if (req.type === 'pay_bank' || req.type === 'recv_bank' || req.type === 'transfer' || req.type === 'buy') {
        const n = parseFloat(pl.amount);
        return isNaN(n) ? null : n;
    }
    if (req.type === 'rent' && prop) {
        const dice = pl.dice;
        return calcRent(prop, dice);
    }
    if (req.type === 'build' && prop) {
        if (pl.kind === 'sell') return Math.floor(prop.houseCost / 2);
        return prop.houseCost;
    }
    if (req.type === 'mortgage' && prop) return prop.mortgage;
    if (req.type === 'unmortgage' && prop) return Math.round(prop.mortgage * 1.1);
    if (req.type === 'trade') {
        const oa = (pl.offerA && pl.offerA.cash) || 0;
        const ob = (pl.offerB && pl.offerB.cash) || 0;
        const n = Math.abs(oa - ob);
        return n > 0 ? n : null;
    }
    return null;
}
function reqDetail(req) {
    const th = requestTheme(req.type, (req.payload || {}).kind);
    const amt = requestAmount(req);
    const bits = [th.title];
    if (amt != null) bits.push(formatMoney(amt));
    const pl = req.payload || {};
    if (pl.propertyId) {
        const pr = getProp(pl.propertyId);
        if (pr) bits.push(pr.name);
    }
    if (pl.reason) bits.push(pl.reason);
    if (pl.toPlayerId) {
        const t = getPlayer(pl.toPlayerId);
        if (t) bits.push('ke ' + t.name);
    }
    if (pl.payerId) {
        const pay = getPlayer(pl.payerId);
        if (pay) bits.push('dari ' + pay.name);
    }
    if (req.type === 'trade') {
        const a = getPlayer(pl.aId);
        const b = getPlayer(pl.bId);
        const na = ((pl.offerA && pl.offerA.propertyIds) || []).length;
        const nb = ((pl.offerB && pl.offerB.propertyIds) || []).length;
        bits.push((a ? a.name : '?') + ' ⇄ ' + (b ? b.name : '?'));
        bits.push(na + '+' + nb + ' aset');
    }
    return bits.join(' · ');
}

function validateTradePayload(pl) {

    if (a.bankrupt || b.bankrupt) return { ok: false, reason: 'Pemain bangkrut tidak bisa tukar' };
    const oa = normalizeOffer(pl.offerA);
    const ob = normalizeOffer(pl.offerB);

        return { ok: false, reason: 'Tawaran kosong' };

        for (let i = 0; i < offer.propertyIds.length; i++) {
            const prop = getProp(offer.propertyIds[i]);

            if (prop.houses > 0 || prop.hotel) return 'Jual bangunan dulu: ' + prop.name;

    const ob = normalizeOffer(pl.offerB);

        const prop = getProp(id);
        if (!prop) return;
        prop.ownerId = b.id;
        pushTx({ type: 'deed', from: a.id, to: b.id, propertyId: id, amount: 0, reason: 'Tukar ' + prop.name });
    });
    ob.propertyIds.forEach(function (id) {
        const prop = getProp(id);
        if (!prop) return;
        prop.ownerId = a.id;
        pushTx({ type: 'deed', from: b.id, to: a.id, propertyId: id, amount: 0, reason: 'Tukar ' + prop.name });
    });
    if (oa.cash > 0) {
        a.balance -= oa.cash;
        b.balance += oa.cash;
        pushTx({ type: 'p2p', from: a.id, to: b.id, amount: oa.cash, reason: 'Uang tukar' });
    }
    if (ob.cash > 0) {
        b.balance -= ob.cash;
        a.balance += ob.cash;
        pushTx({ type: 'p2p', from: b.id, to: a.id, amount: ob.cash, reason: 'Uang tukar' });
    }

        bId: tradeUi.bId,
        offerA: normalizeOffer(tradeUi.offerA),
        offerB: normalizeOffer(tradeUi.offerB),
        waitingOn: tradeUi.role === 'banker' ? null : tradeUi.bId,
        round: 1

        const req = {
            id: generateId(),

            type: 'trade',

            status: 'pending',
            createdAt: Date.now(),
            resolvedAt: null,
            bankerNote: ''

            return;

        hideTradeOverlay();

        return;

        closeModal();
        showToast('Kamu sudah mengajukan, tunggu banker', 'error');
        return;
    }
    noteSubmit(fp);
    const tradeReq = {
        id: generateId(),
        playerId: me.id,
        type: 'trade',
        payload: payload,
        status: 'negotiating',
        createdAt: Date.now(),
        resolvedAt: null,
        bankerNote: ''

function acceptPlayerTrade(id) {
    const me = sessionPlayer();
    const req = (state.requests || []).find(function (r) { return r.id === id; });
    if (!me || !req || req.status !== 'negotiating' || req.payload.waitingOn !== me.id) {
        showToast('Tawaran tidak berlaku', 'error');
        hideTradeOverlay();
        return;
    }
    const v = validateTradePayload(req.payload);
    if (!v.ok) { showToast(v.reason, 'error'); return; }
    req.status = 'pending';
    req.payload.waitingOn = null;
    hideTradeOverlay();
    renderAll({ skipSave: true });
    upsertRequestOnServer(req);
    showToast('Tawaran diajukan ke banker', 'success');
}
function rejectPlayerTrade(id) {
    const me = sessionPlayer();
    const req = (state.requests || []).find(function (r) { return r.id === id; });
    if (!me || !req || req.status !== 'negotiating' || req.payload.waitingOn !== me.id) {
        hideTradeOverlay();
        return;
    }
    req.status = 'rejected';
    req.resolvedAt = Date.now();
    hideTradeOverlay();
    renderAll({ skipSave: true });
    upsertRequestOnServer(req);
    showToast('Tawaran ditolak', 'success');
}

function enqueueRequest(type, payload) {
    if (gameIsOver()) { showToast('Permainan sudah berakhir', 'error'); return; }
    if (!playerCanRequest()) { showToast('Tidak bisa mengirim permintaan', 'error'); return; }
    payload = payload || {};
    if (type === 'build' && payload.propertyId) {
        const kind = payload.kind;
        const r = kind === 'hotel' ? canPlayerBuildHotel(payload.propertyId)
            : (kind === 'sell' ? canPlayerSellBuild(payload.propertyId) : canPlayerBuildHouse(payload.propertyId));
        if (!r.ok) { showToast(r.reason, 'error'); return; }
    }
    if (type === 'mortgage' && payload.propertyId) {
        const r = canPlayerMortgage(payload.propertyId);
        if (!r.ok) { showToast(r.reason, 'error'); return; }
    }
    if (type === 'unmortgage' && payload.propertyId) {
        const r = canPlayerUnmortgage(payload.propertyId);
        if (!r.ok) { showToast(r.reason, 'error'); return; }
    }
    if (type === 'rent') {
        const p = getProp(payload.propertyId);
        const me = sessionPlayer();
        const payer = getPlayer(payload.payerId);
        if (!p || !me || p.ownerId !== me.id) { showToast('Hanya pemilik yang menagih', 'error'); return; }
        if (p.mortgaged) { showToast('Aset hipotek tidak bisa ditagih', 'error'); return; }
        if (!payer || payer.id === me.id) { showToast('Pilih pemain yang mendarat', 'error'); return; }
        if (p.group === 'utility') {
            const dice = parseFloat(payload.dice);
            if (isNaN(dice) || dice < 2 || dice > 12) { showToast('Dadu 2–12', 'error'); return; }
        }
        const rentAmt = calcRent(p, payload.dice);
        if (rentAmt > 0 && playerLiquidity(payer.id) < rentAmt) {
            showToast('Likuiditas pembayar kurang dari sewa', 'error');
        }
    }
    if (type === 'pay_bank') {
        const me = sessionPlayer();
        const amt = parseFloat(payload.amount);
        if (me && !isNaN(amt) && amt > 0 && playerLiquidity(me.id) < amt) {
            showToast('Likuiditas kurang dari tagihan bank', 'error');
        }
    }
    if (!Array.isArray(state.requests)) state.requests = [];
    const fp = requestFingerprint(appSession.playerId, type, payload || {});
    if (enqueueBusy || isDuplicatePending(appSession.playerId, type, payload || {})) {
        closeModal();
        showToast('Kamu sudah mengajukan, tunggu banker', 'error');
        return;
    }
    enqueueBusy = true;
    noteSubmit(fp);
    const req = {
        id: generateId(),
        playerId: appSession.playerId,
        type: type,
        payload: payload || {},
        status: 'pending',
        createdAt: Date.now(),
        resolvedAt: null,
        bankerNote: ''
    };
    state.requests.push(req);
    closeModal();
    renderAll({ skipSave: true });
    upsertRequestOnServer(req).then(function (ok) {
        enqueueBusy = false;
        if (ok === 'duplicate') {
            state.requests = (state.requests || []).filter(function (r) { return r.id !== req.id; });
            renderAll({ skipSave: true });
            showToast('Kamu sudah mengajukan, tunggu banker', 'error');
            return;
        }
        if (!ok) showToast('Gagal mengirim permintaan', 'error');
    }, function () { enqueueBusy = false; });
    showToast('Permintaan dikirim', 'success');
}

function oldestPendingRequest() {
    return (state.requests || []).filter(function (r) { return r && r.status === 'pending'; })

function syncBankerRequestOverlay() {
    maybeShowDebtOverlay();
    if (gameIsOver()) {
        hideRequestOverlay();
        return;
    }
    if (state.debtSettlement) {
        hideRequestOverlay();
        return;
    }
    if (!isServerMode() || isPlayer() || roleGateOpen || moneyFxCanClose || resolvingRequestId) return;
    if (Date.now() < bankerPopupHoldUntil) return;
    if (shownRequestId) {
        const cur = (state.requests || []).find(function (r) { return r.id === shownRequestId; });
        if (!cur || cur.status !== 'pending') {
            hideRequestOverlay();
            showToast('Sudah diproses di perangkat lain', 'success');
        }
    }
    maybeShowBankerRequestPopup();
}
function maybeShowBankerRequestPopup() {
    if (gameIsOver()) {
        hideRequestOverlay();
        return;
    }
    if (state.debtSettlement) {
        hideRequestOverlay();
        return;
    }
    if (!isServerMode() || isPlayer() || roleGateOpen || moneyFxCanClose || resolvingRequestId) return;
    if (Date.now() < bankerPopupHoldUntil) return;
    const req = oldestPendingRequest();
    const box = document.getElementById('requestOverlay');
    if (!box) return;
    if (!req) {
        hideRequestOverlay();
        return;
    }
    if (requestGateOpen && shownRequestId === req.id) return;
    const isNew = shownRequestId !== req.id;
    requestGateOpen = true;
    shownRequestId = req.id;
    if (isNew && lastBankerSoundReqId !== req.id) {
        lastBankerSoundReqId = req.id;
        playNotifySound();
    }
    const busy = !!resolvingRequestId;
    box.classList.remove('hidden');
    box.innerHTML = '<div class="role-card">' + requestPopupHtml(req) +
        '<div class="flex gap-2 mt-4">' +
        '<button type="button" class="btn btn-recv"' + (busy ? ' disabled' : '') + ' onclick="approveRequest(\'' + req.id + '\')">Setujui</button>' +
        '<button type="button" class="btn btn-danger"' + (busy ? ' disabled' : '') + ' onclick="rejectRequest(\'' + req.id + '\')">Tolak</button></div></div>';
}
function approveRequest(id) {
    if (isPlayer()) return;
    resolveRequest(id, true);
}
function rejectRequest(id) {
    if (isPlayer()) return;
    resolveRequest(id, false);
}
async function resolveRequest(id, approve) {
    if (isPlayer() || resolvingRequestId) return;
    resolvingRequestId = id;
    hideRequestOverlay();
    bankerPopupHoldUntil = Date.now() + 450;
    if (!isServerMode()) {
        const req = (state.requests || []).find(function (r) { return r.id === id; });
        if (!req || req.status !== 'pending') {
            showToast('Sudah diproses di perangkat lain', 'success');
            resolvingRequestId = null;
            setTimeout(function () { maybeShowBankerRequestPopup(); }, 450);
            return;
        }
        if (approve) {
            const ok = applyApprovedRequest(req);
            if (!ok) { resolvingRequestId = null; return; }
            req.status = 'approved';
            req.resolvedAt = Date.now();
        } else {
            req.status = 'rejected';
            req.resolvedAt = Date.now();
            showToast('Permintaan ditolak', 'success');
        }
        renderAll({ skipSave: true, skipBankerPopup: true });
        saveState();
        resolvingRequestId = null;
        setTimeout(function () { maybeShowBankerRequestPopup(); }, 450);
        return;
    }
    const data = await postOp({ _op: approve ? 'commitRequest' : 'rejectRequest', id: id });
    if (!data || !data.ok) showToast((data && data.error) || 'Gagal memproses', 'error');
    else if (!approve) showToast('Permintaan ditolak', 'success');
    resolvingRequestId = null;
    setTimeout(function () { maybeShowBankerRequestPopup(); }, 450);
}
function applyApprovedRequest(req) {
    const pl = req.payload || {};
    if (req.type === 'go') {
        const p = getPlayer(req.playerId);
        if (!p) { showToast('Pemain tidak ada', 'error'); return false; }
        const old = snapshotBalances();
        p.balance += state.settings.goAmount;
        pushTx({ type: 'go', from: 'bank', to: p.id, amount: state.settings.goAmount, reason: 'GO' });
        finishMoney('bank', p.id, old, p.name + ' +' + formatMoney(state.settings.goAmount), state.settings.goAmount);
        return true;
    }
    if (req.type === 'pay_bank') {
        const p = getPlayer(req.playerId);
        const amt = parseFloat(pl.amount);
        if (!p || isNaN(amt) || amt <= 0) { showToast('Data bayar tidak valid', 'error'); return false; }
        return applyPayBankDue(p, amt, pl.reason || 'Bayar bank');
    }
    if (req.type === 'recv_bank') {
        const p = getPlayer(req.playerId);
        const amt = parseFloat(pl.amount);
        if (!p || isNaN(amt) || amt <= 0) { showToast('Data terima tidak valid', 'error'); return false; }
        const old = snapshotBalances();
        p.balance += amt;
        pushTx({ type: 'recv-bank', from: 'bank', to: p.id, amount: amt, reason: pl.reason || 'Terima bank' });
        finishMoney('bank', p.id, old, p.name + ' terima ' + formatMoney(amt), amt);
        return true;
    }
    if (req.type === 'transfer') {
        const a = getPlayer(req.playerId);
        const b = getPlayer(pl.toPlayerId);
        const amt = parseFloat(pl.amount);
        if (!a || !b || isNaN(amt) || amt <= 0) { showToast('Transfer tidak valid', 'error'); return false; }
        if (!canAfford(a, amt)) return false;
        const old = snapshotBalances();
        a.balance -= amt;
        b.balance += amt;
        pushTx({ type: 'p2p', from: a.id, to: b.id, amount: amt, reason: pl.reason || 'Transfer' });
        finishMoney(a.id, b.id, old, a.name + ' → ' + b.name + ' ' + formatMoney(amt), amt);
        return true;
    }
    if (req.type === 'buy') {
        const p = getProp(pl.propertyId);
        const buyer = getPlayer(req.playerId);
        const price = parseFloat(pl.amount);
        if (!p || p.ownerId) { showToast('Sudah dimiliki', 'error'); return false; }
        if (!buyer || isNaN(price) || price < 0) return false;
        if (!canAfford(buyer, price)) return false;
        const old = snapshotBalances();
        buyer.balance -= price;
        p.ownerId = buyer.id;
        pushTx({ type: 'buy', from: buyer.id, to: 'bank', propertyId: p.id, amount: price, reason: 'Beli ' + p.name });
        finishMoney(buyer.id, 'bank', old, buyer.name + ' beli ' + p.name, price);
        return true;
    }
    if (req.type === 'rent') {
        const p = getProp(pl.propertyId);
        let payer = getPlayer(pl.payerId);
        if (!payer && req.playerId && p && req.playerId !== p.ownerId) payer = getPlayer(req.playerId);
        if (!p || !p.ownerId || p.mortgaged || !payer) { showToast('Tidak bisa sewa', 'error'); return false; }
        if (payer.id === p.ownerId) return false;
        let dice = pl.dice;
        if (p.group === 'utility') {
            dice = parseFloat(dice);
            if (isNaN(dice) || dice < 2 || dice > 12) { showToast('Dadu 2–12', 'error'); return false; }
        }
        const amount = calcRent(p, dice);
        if (amount <= 0) return false;
        const owner = getPlayer(p.ownerId);
        return applyRentDue(payer, owner, amount, p.id);
    }
    if (req.type === 'build') {
        if (pl.kind === 'hotel') buildHotel(pl.propertyId);
        else if (pl.kind === 'sell') sellHouse(pl.propertyId);
        else buildHouse(pl.propertyId);
        return true;
    }
    if (req.type === 'mortgage') { mortgageProp(pl.propertyId); return true; }
    if (req.type === 'unmortgage') { unmortgageProp(pl.propertyId); return true; }
    if (req.type === 'trade') return applyApprovedTrade(pl);
    showToast('Jenis permintaan tidak dikenal', 'error');
    return false;
}

function showRoleModal() {
    roleGateOpen = true;
    const box = document.getElementById('roleOverlay');
    box.classList.remove('hidden');
    box.innerHTML = '<div class="role-card">' +
        '<p class="text-xl font-extrabold mb-1">Siapa Anda?</p>' +
        '<p class="text-sm mb-4" style="color:var(--muted)">Pilih peran di perangkat ini</p>' +
        '<div class="flex gap-2 mb-3">' +
        '<button type="button" class="btn btn-recv" onclick="chooseBanker()">Banker</button>' +
        '<button type="button" class="btn btn-player-role" onclick="showPlayerJoin()">Pemain</button></div>' +
        '<div id="playerJoinBox"></div></div>';
}
function hideRoleModal() {
    roleGateOpen = false;
    const box = document.getElementById('roleOverlay');
    box.classList.add('hidden');
    box.innerHTML = '';
}
function chooseBanker() {
    writeSession({ role: 'banker' });
    hideRoleModal();
    currentView = 'players';
    renderAll();
}
function showPlayerJoin() {
    const box = document.getElementById('playerJoinBox');
    if (!box) return;
    box.innerHTML = '<input id="joinName" class="input-field mb-2" placeholder="Nama pemain" maxlength="24" autocomplete="off">' +
        '<p id="joinErr" class="text-xs mb-2" style="color:#dc2626"></p>' +
        btnHtml('btn-recv', 'fa-right-to-bracket', 'Masuk sebagai pemain', 'confirmPlayerJoin()');
}
async function confirmPlayerJoin() {
    const nameEl = document.getElementById('joinName');
    const name = ((nameEl || {}).value || '').trim();
    const err = document.getElementById('joinErr');
    if (!name) { if (err) err.textContent = 'Nama wajib'; return; }
    const btn = document.querySelector('#playerJoinBox button');
    if (btn) { btn.disabled = true; btn.textContent = 'Mengecek nama…'; }
    if (err) err.textContent = '';
    if (isServerMode()) {
        try {
            const ok = await loadStateFromServer();
            if (!ok) {
                if (err) err.textContent = 'Gagal sinkron data. Coba lagi.';
                if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Masuk sebagai pemain'; }
                return;
            }
        } catch (e) {
            if (err) err.textContent = 'Gagal sinkron data. Coba lagi.';
            if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Masuk sebagai pemain'; }
            return;
        }
    }
    const found = state.players.find(function (p) { return p.name.trim().toLowerCase() === name.toLowerCase(); });
    if (!found) {
        if (err) err.textContent = 'Nama belum terdaftar. Minta banker menambah pemain.';
        if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Masuk sebagai pemain'; }
        return;
    }
    writeSession({ role: 'player', playerId: found.id, name: found.name });
    hideRoleModal();
    currentView = 'players';
    renderAll();
}
function logoutSession() {
    hideGameOverOverlay(true);
    hideRequestOverlay();
    hideTradeOverlay();
    hideDebtOverlay();
    writeSession(null);
    if (isServerMode()) showRoleModal();
    else renderAll();
}

function modalIsOpen() {
    return !!document.querySelector('#modalContainer .modal-overlay') || moneyFxCanClose;
}
function pollBusy() {
    return pollInFlight || saveInFlight || resolvingRequestId || moneyFxCanClose || modalIsOpen();
}
function startPolling() {
    if (!isServerMode() || pollTimer) return;
    pollTimer = setInterval(async function () {
        if (pollBusy()) return;
        pollInFlight = true;
        const seq = ++pollSeq;
        try {
            const r = await fetch(SAVE_URL, { cache: 'no-store' });
            if (!r.ok) return;
            const data = await r.json();
            if (!data) return;
            if (seq < pollAppliedSeq) return;
            const raw = JSON.stringify(data);
            if (raw === lastRemoteJson) {
                pollAppliedSeq = seq;
                return;
            }
            suppressSave = true;
            applyLoaded(data);
            pollAppliedSeq = seq;
            lastRemoteJson = raw;
            const kicked = kickStalePlayerSession();
            if (kicked || roleGateOpen) {
                suppressSave = false;
                maybeShowGameOver();
                return;
            }
            applyChrome();
            if (isPlayer()) {
                renderPlayerHome();
                renderPlayerAssets();
                renderBoardView();
                renderPlayerQueue();
                renderPlayerSettings();
            } else {
                renderPlayersView();
                renderBoardView();
                renderCashView();
                renderSettingsView();
            }
            suppressSave = false;
            maybePlayRemoteFx();
            maybeShowDebtOverlay();
            syncBankerRequestOverlay();
            maybeShowTradeOverlay();
            maybeShowGameOver();
        } catch (e) {}
        finally { pollInFlight = false; }
    }, 800);
}

async function bootApp() {
    if (isServerMode()) await loadStateFromServer();
    else loadStateFromLocal();
    if (!Array.isArray(state.requests)) state.requests = [];
    appSession = isServerMode() ? readSession() : { role: 'banker' };
    if (isServerMode() && !appSession) showRoleModal();
    else kickStalePlayerSession();
    if (roleGateOpen) {
        maybeShowGameOver();
        startPolling();
        document.addEventListener('pointerdown', function () { getAudioCtx(); }, { once: true });
        return;
    }
    applyChrome();
    renderAll();
    maybePlayRemoteFx();
    startPolling();
    document.addEventListener('pointerdown', function () { getAudioCtx(); }, { once: true });
}

document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (moneyFxCanClose) { closeMoneyFx(); return; }
    const go = document.getElementById('gameOverOverlay');
    if (go && !go.classList.contains('hidden')) { hideGameOverOverlay(); return; }
    const debt = document.getElementById('debtOverlay');
    if (debt && !debt.classList.contains('hidden')) return;
    closeModal();
});
bootApp();
</script>
